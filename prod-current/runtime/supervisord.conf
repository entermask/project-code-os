[unix_http_server]
file=/root/autodl-tmp/supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/supervisor/supervisord.log
pidfile=/root/autodl-tmp/supervisor/supervisord.pid
childlogdir=/root/autodl-tmp/logs
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/supervisor/supervisor.sock

[program:higgs_api]
command=/root/autodl-tmp/bin/higgs-api.sh
directory=/root/autodl-tmp/Fish-Audio
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/logs/higgs_api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[program:higgs_sglang]
command=/root/autodl-tmp/bin/higgs-sglang.sh
directory=/root/autodl-tmp/Fish-Audio
autostart=true
autorestart=true
startsecs=60
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/logs/higgs_sglang.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
