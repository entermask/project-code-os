[unix_http_server]
file=/root/autodl-tmp/prod-compare/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/prod-compare/logs/supervisord.log
pidfile=/root/autodl-tmp/prod-compare/supervisord.pid
childlogdir=/root/autodl-tmp/prod-compare/logs
nodaemon=false
minfds=1024
minprocs=100

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/prod-compare/supervisor.sock

[program:prod_clone_api]
command=/root/autodl-tmp/prod-compare/prod-clone-api.sh
directory=/root/autodl-tmp/Fish-Audio/prod-current
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/prod-compare/logs/prod_clone_api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
